name: automated_updates

# Run daily at 3am
on:
  schedule:
    - cron:  '0 3 * * *'



jobs:
  update_data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1  # Increment this number to invalidate cache

      - name: Scrape data and build database
        run: |
          Rscript update_data.R

      - name: Commit files
        run: |
          git config --local user.name actions-user
          git config --local user.email "actions@github.com"
          git add data_raw database
          git diff --cached --quiet && exit 0
          git commit -m "automated update from github actions: $(date)"
          git push origin main
        env:
          REPO_KEY: ${{secrets.GITHUB_TOKEN}}
          username: github-actions
