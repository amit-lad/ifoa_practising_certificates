name: tests

# Run the R tests when the code or its packages change.
on:
  push:
    paths:
      - "R/**"
      - "tests/**"
      - "update_data.R"
      - "renv.lock"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1 # Increment to invalidate the package cache

      - name: Run tests
        run: Rscript tests/testthat.R

      - name: Rebuild the database from the existing snapshots
        run: Rscript update_data.R --no-scrape
