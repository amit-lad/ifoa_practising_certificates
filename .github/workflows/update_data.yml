name: update_data

# Scrape the directory and rebuild the database, daily or on demand. Netlify
# renders the dashboard when the new data is pushed to main. If the database
# changed, email the changes (see "Change emails" in the README).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# A run started by hand waits for a scheduled one, so the two never push at once.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update_data:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # The Gmail account that sends the change email, from the repository's
      # secrets (see README.md). Without it the email is skipped.
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1 # Increment to invalidate the package cache

      - name: Scrape data and build database
        run: Rscript update_data.R

      - name: Commit and push the new data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dashboard/dashboard_data.json
          git diff --cached --quiet && exit 0
          git commit -m "automated update from github actions: $(date)"
          git push origin main

      # update_data.R writes the email only when something changed.
      - name: Read email subject
        id: email
        if: hashFiles('email/email.html') != '' && env.MAIL_USERNAME != ''
        run: echo "subject=$(cat email/subject.txt)" >> "$GITHUB_OUTPUT"

      - name: Email the changes
        if: steps.email.outcome == 'success'
        uses: dawidd6/action-send-mail@47af4a10b540781705f283a2cf1a9650713ac795 # v23
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          # A Google app password, not the account's own password.
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.email.outputs.subject }}
          # MAIL_TO is optional; the email goes to the sending account without it.
          to: ${{ secrets.MAIL_TO || secrets.MAIL_USERNAME }}
          from: IFoA practising certificates <${{ secrets.MAIL_USERNAME }}>
          html_body: file://email/email.html
