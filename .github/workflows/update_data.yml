name: update_data

# Scrape the directory and rebuild the database, daily or on demand. Netlify
# renders the dashboard when the new data is pushed to main.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update_data:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1 # Increment to invalidate the package cache

      - name: Scrape data and build database
        run: Rscript update_data.R

      - name: Commit and push the new data
        run: |
          git config --local user.name actions-user
          git config --local user.email "actions@github.com"
          git add data dashboard/dashboard_data.json
          git diff --cached --quiet && exit 0
          git commit -m "automated update from github actions: $(date)"
          git push origin main
