# Netlify renders the dashboard. GitHub Actions only updates the data; each
# data commit to main triggers a Netlify build. See dashboard/netlify_build.sh.
[build]
  command = "bash dashboard/netlify_build.sh"
  publish = "dashboard/_site"

[build.environment]
  # Not used by the build; set to a supported version to avoid Netlify's
  # Node 16 deprecation warning.
  NODE_VERSION = "22"
