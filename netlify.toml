# Netlify renders the dashboard. GitHub Actions only updates the data (data_raw/ and database/);
# each data commit to main triggers a Netlify build. See netlify_build.sh.
[build]
  command = "bash netlify_build.sh"
  publish = "_site"

[build.environment]
  # Not used by the build; set to a supported version to avoid Netlify's Node 16 deprecation warning.
  NODE_VERSION = "22"
